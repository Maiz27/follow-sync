<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title">
  <title id="title">Follow Sync logo</title>
  <!-- Nodes. 8-unit grid. Two 56-unit square nodes at opposite corners; each sends a follow toward the other.
       Shafts 28 (up from 24 in the concept) so the 32 px version keeps a 2 px line. Heads and nodes share one height. -->
  <g id="symbol" fill="#111111">
    <path id="out" d="M32 48 H88 V62 H168 V48 L216 76 L168 104 V90 H88 V104 H32 Z"/>
    <path id="back" d="M224 208 H168 V194 H88 V208 L40 180 L88 152 V166 H168 V152 H224 Z"/>
  </g>
</svg>
